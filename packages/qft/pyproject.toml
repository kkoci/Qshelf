[project]
name = "qft"
version = "0.1.0"
description = "Quantum Fourier Transform and inverse-QFT building blocks, distributed as a linkable HUGR Package."
requires-python = ">=3.12,<4"
dependencies = [
    "guppylang==1.0.3",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "numpy~=2.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qft"]
