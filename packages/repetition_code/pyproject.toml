[project]
name = "repetition-code"
version = "0.1.0"
description = "3-qubit bit-flip repetition code (encode / syndrome extraction / correction), distributed as a linkable HUGR Package."
requires-python = ">=3.12,<4"
dependencies = [
    "guppylang==1.0.3",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "numpy~=2.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repetition_code"]
