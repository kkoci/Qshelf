[project]
name = "repetition-code-v2"
version = "0.1.0"
description = "The bit-flip repetition code generalized to arbitrary code distance and repeated syndrome-extraction rounds, distributed as a linkable HUGR Package."
requires-python = ">=3.12,<4"
dependencies = [
    "guppylang==1.0.2",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "numpy~=2.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repetition_code_v2"]
